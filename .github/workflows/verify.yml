name: Verify package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject private runtime artifacts
        run: |
          ! git ls-files | grep -E '(^|/)(admin\.json|state\.json|config\.json|[^/]+\.(pem|key|crt)|relay-admin-credentials\.txt)$'
          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|password_hash.{0,80}[A-Za-z0-9_-]{20,}' -- ':!.github/workflows/verify.yml'; then exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install qrcode
      - name: Backend regression tests
        env:
          PYTHONPATH: relay_admin
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n install.sh update.sh selftest.sh
      - name: Python syntax
        run: python3 -m py_compile relay_admin/app.py relay_admin/operations.py
      - name: Ensure the package has all runtime assets
        run: |
          for file in app.py operations.py console.css console.js delete-dialog.js login.js; do
            test -f "relay_admin/$file"
          done
          test -f selftest.sh
      - name: Traffic accounting wiring
        run: |
          grep -q 'StatsService' install.sh
          grep -q 'statsUserUplink' install.sh
          grep -q 'def ensure_stats_service' relay_admin/app.py
          grep -q 'stats_service_config_needed' relay_admin/app.py
          grep -q 'def forward_stats_keys' relay_admin/app.py
          grep -q 'StatsService reports per-user traffic' selftest.sh
